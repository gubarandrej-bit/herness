<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Вход — herness</title>
<link rel="stylesheet" href="/static/css/herness.css"></head>
<body class="login-body">
<div class="login-box">
  <h1>⚡ herness</h1>
  <p class="subtitle">Проверка проектной документации</p>
  <div id="login-error" class="error-msg" style="display:none"></div>
  <form onsubmit="login(event)">
    <label>Логин</label>
    <input type="text" id="login-login" value="admin" autocomplete="username">
    <label>Пароль</label>
    <input type="password" id="login-password" value="admin123" autocomplete="current-password">
    <button type="submit" class="btn-primary" style="width:100%;margin-top:12px">Войти</button>
  </form>
</div>
<script>
async function login(e){e.preventDefault();const r=await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:`login=${encodeURIComponent(document.getElementById('login-login').value)}&password=${encodeURIComponent(document.getElementById('login-password').value)`});const j=await r.json();if(j.ok){window.location='/';return}document.getElementById('login-error').style.display='block';document.getElementById('login-error').textContent=j.detail||'Ошибка входа'}
</script>
</body>
</html>
