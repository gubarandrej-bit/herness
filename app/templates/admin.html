<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Админ — herness</title>
<link rel="stylesheet" href="/static/css/herness.css"></head>
<body>
<nav class="topbar"><div class="topbar-left"><a href="/" class="logo">⚡ herness</a><span>Администрирование</span></div></nav>
<main class="layout">
<aside class="sidebar">
  <h3>Пользователи</h3>
  <div id="user-list"></div>
</aside>
<section class="main-area">
  <div class="card">
    <h2>Управление пользователями</h2>
    <table id="users-table"><thead><tr><th>ID</th><th>Логин</th><th>Роль</th><th>Статус</th><th>Действия</th></tr></thead><tbody></tbody></table>
    <hr>
    <h3>Добавить пользователя</h3>
    <form onsubmit="addUser(event)">
      <input type="text" id="new-login" placeholder="Логин" required>
      <input type="password" id="new-password" placeholder="Пароль" required>
      <input type="text" id="new-name" placeholder="Полное имя">
      <select id="new-role"><option value="user">Пользователь</option><option value="admin">Администратор</option></select>
      <button type="submit" class="btn-primary">Создать</button>
    </form>
  </div>
  <div class="card">
    <h3>Модели ИИ</h3>
    <div id="ai-model-list"></div>
    <button onclick="showAddModel()" class="btn-sm">+ Добавить модель</button>
  </div>
</section>
</main>
<div id="modal-overlay" class="modal-overlay" style="display:none" onclick="closeModal()"><div class="modal" onclick="event.stopPropagation()"><div id="modal-content"></div></div></div>
<script src="/static/js/herness.js"></script>
<script>loadUsers();loadAiModels();</script>
</body>
</html>
